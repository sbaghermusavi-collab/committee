spring:
  messages:
    encoding: UTF-8
  application:
    name: committee
    version: '@project.version@'
  profiles:
    active: dev
  datasource:
    hikari:
      connection-test-query: SELECT 1 FROM DUAL
      maximum-pool-size: 10
  devtools:
    restart:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      org:
        hibernate:
          envers:
            store_data_at_delete: true

      hibernate:
        enable_lazy_load_no_trans: true
        hbm2ddl:
          schema_filter_provider: org.hibernate.Incubating.SchemaFilterProvider
    open-in-view: false
    show-sql: true
  liquibase:
    database-change-log-table: Z_LIQ_CHANGELOG
    database-change-log-lock-table: Z_LIQ_CHANGELOG_LOCK
    change-log: classpath:/db/master-changelog.xml
    enabled: false
  main:
    allow-bean-definition-overriding: true
  activiti:
    rest-api-enabled: true
    history-level: full
    database-schema-update: true
    db-history-used: true
  redis:
    port: 6379
  servlet:
    multipart:
      max-file-size: 1000MB

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
      force-response: true
    context-path: /committee-backend
    session:
      cookie:
        name: App_${spring.application.name}
  forward-headers-strategy: framework
  use-forward-headers: true
  locale: fa

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always

nicico:
  token:
    revoke: false
  jpa:
    entity:
      package: com.nicico.committee
  google:
    mail:
      username:
      password:
  mail:
    domain:
    url:
    username:
    password:

  upload:
    dir: /var/nicico/${spring.application.name}/
  workflow:
    update:
      mode: true
  bpmn:
    upload:
      dir: /var/nicico/${spring.application.name}/
---


jasypt:
  encryptor:
    bean: stringEncryptor


copper:
  security:
    policy:
      json:
        filePath: ""
feign:
  client:
    config:
      default:
        connectTimeout: 5000   # 5 seconds
        readTimeout: 10000     # 10 seconds
        loggerLevel: FULL

hrm:
  api:
    base-url: "http://devapp01.icico.net.ir/hrm-backend/"
logging:
  level:
    root: INFO
    org.springframework: DEBUG
    org.springframework.boot.autoconfigure: DEBUG

    org.springframework.orm.jpa: DEBUG

    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.jpa: DEBUG

    com.zaxxer.hikari: DEBUG
    liquibase : INFO


